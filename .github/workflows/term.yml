on:
  push:
  schedule:
    - cron: '0 10 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch latest release
        uses: octokit/request-action@v2.x
        id: fetch_latest_release
        with:
          route: GET /repos/be5invis/Iosevka/releases/latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Parse version from release tag
        run: echo IOSEVKA_VERSION=$(echo ${{ fromJson(steps.fetch_latest_release.outputs.data).tag_name }} | sed 's/^v//') >> $GITHUB_ENV
      - name: Checkout latest release
        uses: actions/checkout@v4
        with:
          repository: be5invis/Iosevka
          ref: v${{ env.IOSEVKA_VERSION }}
      - name: Download private build plan
        run: curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/src/term.toml" -o private-build-plans.toml
      - name: Setup cache
        uses: actions/cache@v3
        id: cache
        with:
          path: |
            dist/iosevka-term-custom
            dist/.super-ttc
          key: ${{ env.IOSEVKA_VERSION }}-${{ hashFiles('private-build-plans.toml') }}
      - name: Setup nodejs
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
      - name: Install npm dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm install
      - name: Install ttfautohint
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get install ttfautohint -y -q
      - name: Build TTF fonts
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm run build -- ttf::IosevkaTermCustom
      - name: Build TTC font
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm run build -- super-ttc::IosevkaTermCustom
      - name: Upload TTF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iosevka-term-custom-ttf
          path: dist/iosevka-term-custom/ttf/*
      - name: Upload TTC artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iosevka-term-custom-ttc
          path: dist/.super-ttc/*

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download TTF artifacts
        uses: actions/download-artifact@v4
        with:
          name: iosevka-term-custom-ttf
      - name: Download TTC artifacts
        uses: actions/download-artifact@v4
        with:
          name: iosevka-term-custom-ttc
      - name: Create release archives
        run: |
          zip ttf-iosevka-term-custom.zip *
          cd ../iosevka-term-custom-ttc
          zip ../ttc-iosevka-term-custom.zip *
      - name: Create and upload release
        uses: softprops/action-gh-release@v2
        with:
          name: Iosevka
          tag_name: latest
          files: |
            ttf-iosevka-term-custom.zip
            ttc-iosevka-term-custom.zip
